name: Release userscript

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      mode:
        description: "What should this workflow do?"
        required: true
        default: "release-current"
        type: choice
        options:
          - release-current
          - backfill-missing

      backfill_limit:
        description: "Maximum number of missing historical releases to create"
        required: false
        default: "10"
        type: string

      dry_run:
        description: "Preview backfill actions without creating tags or releases"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: userscript-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Detect userscript file
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          matches=()

          # Prefer *.user.js files.
          for file in ./*.user.js; do
            [ -f "$file" ] || continue
            if grep -q '^// ==UserScript==$' "$file"; then
              matches+=("$file")
            fi
          done

          # Fall back to root-level .js files with a userscript header.
          for file in ./*.js; do
            [ -f "$file" ] || continue
            [[ "$file" == *.user.js ]] && continue
            if grep -q '^// ==UserScript==$' "$file"; then
              matches+=("$file")
            fi
          done

          if [ "${#matches[@]}" -eq 0 ]; then
            echo "No userscript file found in repository root."
            exit 1
          fi

          if [ "${#matches[@]}" -gt 1 ]; then
            echo "More than one userscript file was found."
            echo "Keep exactly one userscript in the repository root,"
            echo "or change this workflow to use an explicit path."
            printf 'Found: %s\n' "${matches[@]}"
            exit 1
          fi

          found="${matches[0]}"

          version="$(
            sed -nE \
              's|^[[:space:]]*//[[:space:]]*@version[[:space:]]+([^[:space:]]+).*|\1|p' \
              "$found" |
            head -n 1
          )"

          if [ -z "$version" ]; then
            echo "No @version found in $found"
            exit 1
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version '$version'. Expected SemVer-like version, e.g. 1.2.3."
            exit 1
          fi

          original_name="$(basename "$found")"

          # A fallback file such as main.js is uploaded as main.user.js.
          if [[ "$original_name" == *.user.js ]]; then
            release_file="$found"
            release_name="$original_name"
          else
            base_name="$(basename "$found" .js)"
            release_name="${base_name}.user.js"
            cp "$found" "./$release_name"
            release_file="./$release_name"
          fi

          tag="v$version"

          echo "file=$found" >> "$GITHUB_OUTPUT"
          echo "repo_path=${found#./}" >> "$GITHUB_OUTPUT"
          echo "original_name=$original_name" >> "$GITHUB_OUTPUT"
          echo "release_file=$release_file" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Fetch remote tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin

      - name: Backfill missing historical releases
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill-missing'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_PATH: ${{ steps.detect.outputs.repo_path }}
          RELEASE_NAME: ${{ steps.detect.outputs.release_name }}
          BACKFILL_LIMIT: ${{ inputs.backfill_limit }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$BACKFILL_LIMIT" =~ ^[1-9][0-9]*$ ]]; then
            echo "backfill_limit must be a positive integer; got: $BACKFILL_LIMIT"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          declare -A version_commit
          declare -A version_content
          declare -A version_seen
          versions=()

          separator=$'\x1f'

          # --follow works backward in history. We record each commit and the
          # matching historical path, including pre-rename file locations.
          mapfile -t history_newest_first < <(
            git log \
              --follow \
              -M \
              --format="${separator}%H" \
              --name-only \
              -- "$REPO_PATH" |
            awk -v sep="$separator" '
              function emit() {
                if (commit != "" && path != "") {
                  print commit sep path
                }
              }

              index($0, sep) == 1 {
                emit()
                commit = substr($0, 2)
                path = ""
                next
              }

              NF && path == "" {
                path = $0
              }

              END {
                emit()
              }
            '
          )

          if [ "${#history_newest_first[@]}" -eq 0 ]; then
            echo "Could not find file history for $REPO_PATH."
            exit 1
          fi

          # Reverse to oldest → newest. The first commit declaring a version
          # is the commit tagged for that version.
          history=()
          for ((index=${#history_newest_first[@]} - 1; index>=0; index--)); do
            history+=("${history_newest_first[$index]}")
          done

          for entry in "${history[@]}"; do
            commit="${entry%%"$separator"*}"
            historical_path="${entry#*"$separator"}"

            content="$(git show "${commit}:${historical_path}" 2>/dev/null || true)"
            [ -n "$content" ] || continue

            grep -q '^// ==UserScript==$' <<< "$content" || continue

            version="$(
              sed -nE \
                's|^[[:space:]]*//[[:space:]]*@version[[:space:]]+([^[:space:]]+).*|\1|p' \
                <<< "$content" |
              head -n 1
            )"

            [ -n "$version" ] || continue

            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
              echo "Skipping historical commit $commit: invalid version '$version'."
              continue
            fi

            if [[ -z "${version_seen[$version]+x}" ]]; then
              version_seen["$version"]=1
              version_commit["$version"]="$commit"
              version_content["$version"]="$content"
              versions+=("$version")
            fi
          done

          if [ "${#versions[@]}" -eq 0 ]; then
            echo "No valid historical userscript versions were found."
            exit 1
          fi

          # Lowest version → highest version: 1.0.9 comes before 1.0.10.
          mapfile -t ordered_versions < <(
            printf '%s\n' "${versions[@]}" | LC_ALL=C sort -V
          )

          created=0
          skipped=0
          conflicts=0
          planned=0
          summary_file="$(mktemp)"

          {
            echo "## Userscript historical backfill"
            echo
            echo "- Release asset: \`$RELEASE_NAME\`"
            echo "- Release order: lowest version to highest version"
            echo "- Historical releases forced not latest: \`true\`"
            echo "- Dry run: \`$DRY_RUN\`"
            echo "- Maximum releases: \`$BACKFILL_LIMIT\`"
            echo
          } > "$summary_file"

          for index in "${!ordered_versions[@]}"; do
            version="${ordered_versions[$index]}"
            commit="${version_commit[$version]}"
            content="${version_content[$version]}"
            tag="v$version"

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "- Skipped \`$tag\`: release already exists." >> "$summary_file"
              skipped=$((skipped + 1))
              continue
            fi

            git fetch --force --tags origin
            existing_tag_commit=""

            if git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null 2>&1; then
              existing_tag_commit="$(git rev-list -n 1 "$tag")"

              if [ "$existing_tag_commit" != "$commit" ]; then
                echo "- Conflict \`$tag\`: existing tag points to \`${existing_tag_commit:0:7}\`, expected \`${commit:0:7}\`." >> "$summary_file"
                conflicts=$((conflicts + 1))
                continue
              fi
            fi

            planned=$((planned + 1))

            previous_tag=""
            if [ "$index" -gt 0 ]; then
              previous_tag="v${ordered_versions[$((index - 1))]}"
            fi

            notes_file="$(mktemp)"
            {
              echo "## What's changed"
              echo

              if [ -n "$previous_tag" ] && git rev-parse -q --verify "refs/tags/$previous_tag^{commit}" >/dev/null 2>&1; then
                git log "${previous_tag}..${commit}" --pretty=format:'- %s (%h)' || true
              else
                git log "$commit" --pretty=format:'- %s (%h)' || true
              fi

              echo
              echo
              echo "Historical backfill release created from commit \`${commit}\`."

              if [ -n "$previous_tag" ]; then
                echo
                echo "**Full Changelog**: ${previous_tag}...${tag}"
              fi
            } > "$notes_file"

            if [ "$DRY_RUN" = "true" ]; then
              if [ -n "$existing_tag_commit" ]; then
                echo "- Would create historical release \`$tag\` from tag at \`${commit:0:7}\` (**not latest**)." >> "$summary_file"
              else
                echo "- Would create tag and historical release \`$tag\` at \`${commit:0:7}\` (**not latest**)." >> "$summary_file"
              fi
            else
              if [ -z "$existing_tag_commit" ]; then
                git tag -a "$tag" "$commit" -m "Release $tag"
                git push origin "refs/tags/$tag"
              fi

              tmp_asset="$(mktemp --suffix=.user.js)"
              printf '%s\n' "$content" > "$tmp_asset"

              # First request non-latest during release creation.
              gh release create "$tag" \
                --title "$tag" \
                --notes-file "$notes_file" \
                --verify-tag \
                --latest=false \
                "${tmp_asset}#${RELEASE_NAME}"

              # Then enforce it via the API. This guards against GitHub CLI
              # edge cases involving --latest=false and asset uploads.
              gh api \
                --method PATCH \
                "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
                -f make_latest=false >/dev/null

              rm -f "$tmp_asset"

              echo "- Created historical release \`$tag\` at \`${commit:0:7}\` (**not latest**)." >> "$summary_file"
              created=$((created + 1))
            fi

            rm -f "$notes_file"

            if [ "$planned" -ge "$BACKFILL_LIMIT" ]; then
              break
            fi
          done

          # Choose the highest stable version from the userscript's history.
          # Anything containing "-" is treated as a prerelease and excluded.
          latest_stable_version=""

          for version in "${ordered_versions[@]}"; do
            if [[ "$version" != *-* ]]; then
              latest_stable_version="$version"
            fi
          done

          if [ -n "$latest_stable_version" ]; then
            latest_tag="v$latest_stable_version"

            if [ "$DRY_RUN" = "true" ]; then
              if gh release view "$latest_tag" >/dev/null 2>&1; then
                echo "- Would ensure \`$latest_tag\` is marked **Latest**." >> "$summary_file"
              else
                echo "- \`$latest_tag\` has no release in this limited run; no release would be marked Latest." >> "$summary_file"
              fi
            elif gh release view "$latest_tag" >/dev/null 2>&1; then
              gh api \
                --method PATCH \
                "repos/${GITHUB_REPOSITORY}/releases/tags/${latest_tag}" \
                -f make_latest=true >/dev/null

              echo "- Marked \`$latest_tag\` as **Latest**." >> "$summary_file"
            else
              echo "- \`$latest_tag\` has no release; no release was marked Latest." >> "$summary_file"
            fi
          fi

          {
            echo
            echo "### Result"
            echo
            if [ "$DRY_RUN" = "true" ]; then
              echo "- Planned releases: \`$planned\`"
            else
              echo "- Created releases: \`$created\`"
            fi
            echo "- Skipped existing releases: \`$skipped\`"
            echo "- Tag conflicts: \`$conflicts\`"
          } >> "$summary_file"

          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"

          if [ "$conflicts" -gt 0 ]; then
            echo "Historical backfill found tag conflicts. No conflicting releases were created."
            exit 1
          fi

      - name: Inspect current release state
        id: current
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release-current')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.detect.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi

          if git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "tag_commit=$(git rev-list -n 1 "$TAG")" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "tag_commit=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or validate current tag
        id: tag
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release-current')) && steps.current.outputs.already_released == 'false'
        env:
          TAG: ${{ steps.detect.outputs.tag }}
          TAG_EXISTS: ${{ steps.current.outputs.tag_exists }}
          TAG_COMMIT: ${{ steps.current.outputs.tag_commit }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          expected_commit="$(git rev-parse HEAD)"

          if [ "$TAG_EXISTS" = "true" ]; then
            if [ "$TAG_COMMIT" != "$expected_commit" ]; then
              echo "Tag $TAG already exists at $TAG_COMMIT,"
              echo "but this workflow is releasing $expected_commit."
              echo "Bump @version before releasing a different commit."
              exit 1
            fi

            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git tag -a "$TAG" "$expected_commit" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

          echo "commit=$expected_commit" >> "$GITHUB_OUTPUT"

      - name: Build current release notes
        id: notes
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release-current')) && steps.current.outputs.already_released == 'false'
        env:
          CURRENT_TAG: ${{ steps.detect.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          previous_tag="$(
            git tag --merged HEAD --sort=-version:refname |
            grep -Fxv "$CURRENT_TAG" |
            head -n 1 ||
            true
          )"

          notes_file="$(mktemp)"

          {
            echo "## What's changed"
            echo

            if [ -n "$previous_tag" ]; then
              git log "$previous_tag..HEAD" --pretty=format:'- %s (%h)'
            else
              git log HEAD --pretty=format:'- %s (%h)'
            fi

            echo
            echo

            if [ -n "$previous_tag" ]; then
              echo "**Full Changelog**: ${previous_tag}...${CURRENT_TAG}"
            fi
          } > "$notes_file"

          {
            echo "content<<EOF"
            cat "$notes_file"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          rm -f "$notes_file"

      - name: Create current release
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release-current')) && steps.current.outputs.already_released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.detect.outputs.tag }}
          VERSION: ${{ steps.detect.outputs.version }}
          RELEASE_NAME: ${{ steps.detect.outputs.release_name }}
          RELEASE_FILE: ${{ steps.detect.outputs.release_file }}
          RELEASE_NOTES: ${{ steps.notes.outputs.content }}
        shell: bash
        run: |
          set -euo pipefail

          notes_file="$(mktemp)"
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"

          # Determine the highest stable release currently published.
          # This prevents an old branch/version from becoming Latest.
          mapfile -t stable_versions < <(
            gh release list \
              --limit 1000 \
              --json tagName,isPrerelease \
              --jq '.[] | select(.isPrerelease == false) | .tagName' |
            sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' |
            LC_ALL=C sort -V
          )

          highest_stable_version=""

          for stable_version in "${stable_versions[@]}"; do
            highest_stable_version="$stable_version"
          done

          current_version="${TAG#v}"
          latest_value="false"

          if [[ "$current_version" != *-* ]]; then
            if [ -z "$highest_stable_version" ]; then
              latest_value="true"
            else
              greatest_version="$(
                printf '%s\n%s\n' "$highest_stable_version" "$current_version" |
                LC_ALL=C sort -V |
                tail -n 1
              )"

              if [ "$greatest_version" = "$current_version" ]; then
                latest_value="true"
              fi
            fi
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$notes_file" \
            --verify-tag \
            --latest="$latest_value" \
            "${RELEASE_FILE}#${RELEASE_NAME}"

          # Explicitly enforce the intended state using GitHub's Releases API.
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            -f make_latest="$latest_value" >/dev/null

          rm -f "$notes_file"

      - name: Write current release summary
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release-current')
        env:
          TAG: ${{ steps.detect.outputs.tag }}
          VERSION: ${{ steps.detect.outputs.version }}
          RELEASE_NAME: ${{ steps.detect.outputs.release_name }}
          RELEASED: ${{ steps.current.outputs.already_released }}
          TAG_COMMIT: ${{ steps.tag.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## Userscript release"
            echo
            echo "- Release asset: \`$RELEASE_NAME\`"
            echo "- Version: \`$VERSION\`"
            echo "- Tag: \`$TAG\`"

            if [ "$RELEASED" = "true" ]; then
              echo "- Result: release already existed; nothing was changed."
            else
              echo "- Result: release created from \`${TAG_COMMIT:0:7}\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
